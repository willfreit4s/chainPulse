syntax = "proto3";

package token.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "internal/pb/token/v1;tokenv1";

// Token represents a cryptocurrency token with its metadata
message Token {
  string id = 1;                                    // UUID
  string address = 2;                               // Contract address (0x...)
  string name = 3;                                  // Token name
  string symbol = 4;                                // Token symbol (BTC, ETH, etc)
  uint32 decimals = 5;                              // Number of decimal places
  double total_supply = 6;                          // Total supply
  string chain = 7;                                 // Blockchain (ethereum, bsc, polygon, etc)
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp deleted_at = 10;
  bool deleted = 11;
}

// HealthCheckResponse is a simple message to indicate service health status.
message HealthCheckResponse {
  string status = 1; // "ok" or "error"
  string version = 2; // Service version
  string service_name = 3; // Name of the service
  string env = 4; // Environment (production, staging, etc)
}

// GetTokenRequest is the request message for retrieving a token by its unique identifier.
message GetTokenRequest {
  string id = 1;
}

// ListTokensResponse is the response message containing a list of tokens.
message ListTokensResponse {
  repeated Token tokens = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListTokensRequest {
  string chain = 1;                                 // Filter by chain (optional)
  int32 limit = 2;                                  // Pagination limit (default: 50)
  int32 offset = 3;                                 // Pagination offset
  string order_by = 4;                              // Order field (created_at, symbol, etc)
  string order_direction = 5;                       // asc or desc
  string search = 6;                                // Search by name or symbol
}

// TokenService defines the gRPC service for managing and retrieving token information and metrics.
service TokenService {
  // HealthCheck is a simple endpoint to check if the service is running
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/v1/health"
    };
  }

  // GetToken retrieves a token by ID or address
  rpc GetTokenById(GetTokenRequest) returns (Token) {
    option (google.api.http) = {
      get: "/v1/tokens/{id}"
    };
  }

  // ListTokens retrieves all tokens with pagination and filtering
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {
    option (google.api.http) = {
      get: "/v1/tokens"
    };
  }
}
